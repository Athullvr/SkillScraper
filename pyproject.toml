[project]
name = "skillscraper"
version = "0.1.0"
description = "Evidence-based discovery, inspection and selection of relevant skills for coding agents"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "mcp>=2.0,<3.0",
    "pydantic>=2.7,<3.0",
    "rich>=13.7,<15.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]

[project.scripts]
skillscraper = "skillscout.entrypoint:cli_main"
skillscout = "skillscout.entrypoint:cli_main"
skillscout-mcp = "skillscout.mcp_entrypoint:main"
skillscout-codex-hook = "skillscout.codex_hook_entrypoint:main"

[build-system]
requires = ["hatchling>=1.24,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

